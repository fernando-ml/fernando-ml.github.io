locale: "en-US"
title: "Fernando Martínez-López"
name: "Fernando Martínez-López"
description: "Reinforcement learning researcher and Computer Science PhD student at Fordham University. World models, representation learning, and multi-agent adaptation."
url: "https://fernandoml.me"
baseurl: ""
repository: "fernando-ml/fernando-ml.github.io"
timezone: America/New_York
future: false
og_image: "portrait.jpg"

author:
  name: "Fernando Martínez-López"
  avatar: "portrait.jpg"
  email: "f.martinezlpz@gmail.com"
  github: "fernando-ml"
  linkedin: "mlfernando"
  googlescholar: "https://scholar.google.com/citations?user=XfyusDUAAAAJ&hl=en"
  orcid: "https://orcid.org/0009-0007-2208-2691"

social:
  links:
    - "https://github.com/fernando-ml"
    - "https://www.linkedin.com/in/mlfernando"
    - "https://scholar.google.com/citations?user=XfyusDUAAAAJ&hl=en"
    - "https://orcid.org/0009-0007-2208-2691"

include:
  - _pages
  - files
exclude:
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - CHANGELOG.md
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - package.json
  - node_modules
  - vendor
  - scripts
  - markdown_generator
  - talkmap
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor

collections:
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: profile
  - scope:
      path: ""
      type: publications
    values:
      layout: profile
  - scope:
      path: ""
      type: portfolio
    values:
      layout: profile

encoding: utf-8
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-sitemap
